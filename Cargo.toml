[package]
name = "note_sync"
version = "0.1.0"
edition = "2021"
description = "Lightweight macOS menu-bar Markdown note sync (git) + qmd search"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.31", default-features = true }
egui = "0.31"
egui_commonmark = { version = "0.20", default-features = false, features = ["pulldown_cmark"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
